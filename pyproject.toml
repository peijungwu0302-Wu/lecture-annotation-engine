[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture-annotation-engine"
version = "0.1.0"
description = "Geometry-aware contracts and skeletons for augmenting lecture PDFs without obscuring source ink."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "pdfplumber>=0.11",
  "pypdf>=6",
  "reportlab>=4"
]

[project.optional-dependencies]
dev = ["jsonschema>=4.23", "PyYAML>=6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
